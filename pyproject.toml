[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "etv"
version = "0.6.1"
description = "A symbolic equivalence verifier for pairs of raw TTIR kernels"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ETV contributors"}]
dependencies = ["egglog==13.2.0", "z3-solver==4.16.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "hypothesis==6.141.1"]
extraction = [
    "torch==2.8.0",
    "ninetoothed @ git+https://github.com/InfiniTensor/ninetoothed.git@efe519d1b12a820e7aa605d775af3d52c8b0d605",
]
ttir = ["triton==3.7.1; platform_system == 'Linux' and python_version >= '3.10'"]

[project.scripts]
etv = "etv.cli:main"

[tool.setuptools.packages.find]
include = ["etv*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
