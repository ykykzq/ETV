[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "etv"
version = "0.3.0"
description = "TTIR observable-memory equivalence verification"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = "MIT"
dependencies = ["egglog==13.2.0", "z3-solver==4.16.0.0"]

[project.optional-dependencies]
ttir = ["triton==3.7.1; sys_platform == 'linux'"]
dev = ["pytest==8.4.2", "hypothesis==6.141.1", "ruff==0.13.1", "mypy==1.18.2", "build==1.3.0", "pybind11==3.0.1"]
benchmark = ["torch==2.8.0", "numpy==2.2.6", "ninetoothed==0.26.0"]

[project.scripts]
etv = "etv.cli:main"
etv-bench = "etv_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/etv", "src/etv_bench"]

[tool.uv]
conflicts = [[{extra = "ttir"}, {extra = "benchmark"}]]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src/etv"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

