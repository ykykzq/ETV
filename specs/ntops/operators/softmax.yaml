schema: operator-requires/v1
operator:
  id: ntops.torch.softmax
  name: softmax
  revision: 1
  category: reduction_sort_and_shape
requires:
  observed_domain_zh: 一个由测试生成的浮点张量；dim 为任一合法非负轴；输出 dtype 独立随机选 float16/32/64，可能与输入 dtype 不同。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    dim:
      kind: scalar_or_shape_parameter
      required: true
      constraints: []
    dtype:
      kind: scalar_or_shape_parameter
      default: null
      constraints:
      - op: value_in
        value: dtype
        values:
        - float16
        - float32
        - float64
  relations:
  - op: nonnegative_valid_axis
    tensor: input
    axis: dim
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_softmax.py
    name: test_softmax
    line: 13
  reviewed: true
