schema: operator-requires/v1
operator:
  id: ntops.torch.median
  name: median
  revision: 1
  category: reduction_sort_and_shape
requires:
  observed_domain_zh: rank 1--3、float16/32；dim 为合法非负轴，被归约轴长度最多 128；`keepdim=False`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: device_is
        tensor: input
        value: cuda
      - op: rank_between
        tensor: input
        lower: 1
        upper: 3
    dim:
      kind: scalar_or_shape_parameter
      default: -1
      constraints: []
    keepdim:
      kind: scalar_or_shape_parameter
      default: false
      constraints:
      - op: equals
        left: keepdim
        right: false
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations:
  - op: nonnegative_valid_axis
    tensor: input
    axis: dim
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_median.py
    name: test_median
    line: 31
  reviewed: true
