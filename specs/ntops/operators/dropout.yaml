schema: operator-requires/v1
operator:
  id: ntops.torch.dropout
  name: dropout
  revision: 1
  category: pooling_convolution_and_random
requires:
  observed_domain_zh: 一个由测试生成的浮点张量；`p` 由 `random.uniform(0,1)` 生成；调用默认 training 行为，没有 eval/inplace case。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    p:
      kind: scalar_or_shape_parameter
      default: 0.5
      constraints:
      - op: value_between
        value: p
        lower: 0.0
        upper: 1.0
        upper_inclusive: false
    training:
      kind: scalar_or_shape_parameter
      default: true
      constraints:
      - op: equals
        left: training
        right: true
    inplace:
      kind: scalar_or_shape_parameter
      default: false
      constraints:
      - op: equals
        left: inplace
        right: false
  relations: []
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_dropout.py
    name: test_dropout
    line: 14
  reviewed: true
