schema: operator-requires/v1
operator:
  id: ntops.torch.layer_norm
  name: layer_norm
  revision: 1
  category: linear_algebra_and_normalization
requires:
  observed_domain_zh: 一个由测试生成的浮点张量；`normalized_shape` 是输入 shape 的任意非空后缀。weight/bias 独立可为 None，否则 shape
    等于该后缀；`eps in {1e-8,1e-5,1e-3}`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    weight:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: weight
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: weight
        values:
        - float16
        - float32
      - op: device_is
        tensor: weight
        value: cuda
      - op: all_dims_between
        tensor: weight
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: weight
        generator: torch.randn
    bias:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: bias
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: bias
        values:
        - float16
        - float32
      - op: device_is
        tensor: bias
        value: cuda
      - op: all_dims_between
        tensor: bias
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: bias
        generator: torch.randn
    normalized_shape:
      kind: scalar_or_shape_parameter
      required: true
      constraints:
      - op: nonempty_shape_suffix
        shape: normalized_shape
        of: input
    eps:
      kind: scalar_or_shape_parameter
      default: 1.0e-05
      constraints:
      - op: value_in
        value: eps
        values:
        - 1.0e-08
        - 1.0e-05
        - 0.001
  relations:
  - op: optional_shape_equals
    tensor: weight
    shape: normalized_shape
  - op: optional_shape_equals
    tensor: bias
    shape: normalized_shape
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_layer_norm.py
    name: test_layer_norm
    line: 16
  reviewed: true
