schema: operator-requires/v1
operator:
  id: ntops.torch.bmm
  name: bmm
  revision: 1
  category: linear_algebra_and_normalization
requires:
  observed_domain_zh: 测试生成的矩阵维度域 外加 batch `b in [4,16]`：`input:(b,m,k)`、`other:(b,k,n)`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: rank_equals
        tensor: input
        value: 3
    mat2:
      kind: tensor
      constraints:
      - op: dtype_in
        tensor: mat2
        values:
        - float16
        - float32
      - op: device_is
        tensor: mat2
        value: cuda
      - op: rank_equals
        tensor: mat2
        value: 3
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations:
  - op: integer_between
    values:
    - m
    - n
    - k
    lower: 1
    upper: 1024
  - op: dim_equal
    left:
    - input
    - 0
    right:
    - mat2
    - 0
  - op: dim_equal
    left:
    - input
    - 2
    right:
    - mat2
    - 1
