schema: operator-requires/v1
operator:
  id: ntops.torch.addmv
  name: addmv
  revision: 1
  category: linear_algebra_and_normalization
requires:
  observed_domain_zh: 复用 测试生成的矩阵维度域 生成器但忽略 `n`：`input:(m,)`、`mat:(m,k)`、`vec:(k,)`；`alpha,beta` 为标准高斯标量。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: shape_equals
        tensor: input
        value:
        - m
    mat:
      kind: tensor
      constraints:
      - op: dtype_in
        tensor: mat
        values:
        - float16
        - float32
      - op: device_is
        tensor: mat
        value: cuda
      - op: shape_equals
        tensor: mat
        value:
        - m
        - k
    vec:
      kind: tensor
      constraints:
      - op: dtype_in
        tensor: vec
        values:
        - float16
        - float32
      - op: device_is
        tensor: vec
        value: cuda
      - op: shape_equals
        tensor: vec
        value:
        - k
    beta:
      kind: scalar_or_shape_parameter
      default: 1
      constraints:
      - op: generated_by
        value: beta
        generator: random.gauss(0, 1)
    alpha:
      kind: scalar_or_shape_parameter
      default: 1
      constraints:
      - op: generated_by
        value: alpha
        generator: random.gauss(0, 1)
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations:
  - op: integer_between
    values:
    - m
    - n
    - k
    lower: 1
    upper: 1024
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_addmv.py
    name: test_addmv
    line: 14
  reviewed: true
