schema: operator-requires/v1
operator:
  id: ntops.torch.lp_pool2d
  name: lp_pool2d
  revision: 1
  category: pooling_convolution_and_random
requires:
  observed_domain_zh: float32 `input:(B,C,H,W)`，`B in [1,3]`、`C in [1,4]`、`H,W in [4,24]`；norm 1/2/3；kernel
    为标量或二元组、每轴最多 5；stride 为 None 或不大于对应 kernel；ceil_mode bool。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: device_is
        tensor: input
        value: cuda
      - op: rank_equals
        tensor: input
        value: 4
    norm_type:
      kind: scalar_or_shape_parameter
      required: true
      constraints:
      - op: value_in
        value: norm_type
        values:
        - 1.0
        - 2.0
        - 3.0
    kernel_size:
      kind: scalar_or_shape_parameter
      required: true
      constraints:
      - op: generated_by
        value: kernel_size
        generator: scalar or pair; each axis is between 1 and min(5, input spatial size)
    stride:
      kind: scalar_or_shape_parameter
      default: null
      constraints:
      - op: generated_by
        value: stride
        generator: None or scalar/pair no larger than kernel_size per axis
    ceil_mode:
      kind: scalar_or_shape_parameter
      default: false
      constraints:
      - op: value_in
        value: ceil_mode
        values:
        - false
        - true
  relations: []
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_lp_pool2d.py
    name: test_lp_pool2d
    line: 15
  reviewed: true
