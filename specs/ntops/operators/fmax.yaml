schema: operator-requires/v1
operator:
  id: ntops.torch.fmax
  name: fmax
  revision: 1
  category: binary_and_comparison
requires:
  observed_domain_zh: 基本 case 是两个同 shape 的浮点张量；广播 case 为 `(4,1,32)` 与 `(1,64,32)`，dtype float16/32。输入均来自
    `randn`，没有 NaN/Inf。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    other:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: other
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: other
        values:
        - float16
        - float32
      - op: device_is
        tensor: other
        value: cuda
      - op: all_dims_between
        tensor: other
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: other
        generator: torch.randn
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations:
  - op: broadcastable
    values:
    - input
    - other
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_fmax.py
    name: test_fmax_elementwise
    line: 10
  - path: tests/test_fmax.py
    name: test_fmax_broadcasting
    line: 28
  reviewed: true
