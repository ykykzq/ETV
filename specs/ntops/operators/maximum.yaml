schema: operator-requires/v1
operator:
  id: ntops.torch.maximum
  name: maximum
  revision: 1
  category: binary_and_comparison
requires:
  observed_domain_zh: 除同 shape 测试生成的浮点输入域 外，覆盖 `(4,1,32)` 与 `(1,64,32)` 广播，以及 float32 `(100,)` 的 `out=`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    other:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: other
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: other
        values:
        - float16
        - float32
      - op: device_is
        tensor: other
        value: cuda
      - op: all_dims_between
        tensor: other
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: other
        generator: torch.randn
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: generated_by
        value: out
        generator: None or a compatible output buffer constructed by the test
  relations:
  - op: broadcastable
    values:
    - input
    - other
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_maximum.py
    name: test_maximum_elementwise
    line: 9
  - path: tests/test_maximum.py
    name: test_maximum_broadcasting
    line: 27
  - path: tests/test_maximum.py
    name: test_maximum_out_variant
    line: 49
  reviewed: true
