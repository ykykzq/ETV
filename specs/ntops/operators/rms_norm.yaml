schema: operator-requires/v1
operator:
  id: ntops.torch.rms_norm
  name: rms_norm
  revision: 1
  category: linear_algebra_and_normalization
requires:
  observed_domain_zh: 一个由测试生成的浮点张量；`normalized_shape` 是任意非空 shape 后缀；weight 为 None 或同后缀 shape；`eps in
    {None,0,1e-5,1e-3}`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    weight:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: weight
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: weight
        values:
        - float16
        - float32
      - op: device_is
        tensor: weight
        value: cuda
      - op: all_dims_between
        tensor: weight
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: weight
        generator: torch.randn
    normalized_shape:
      kind: scalar_or_shape_parameter
      required: true
      constraints:
      - op: nonempty_shape_suffix
        shape: normalized_shape
        of: input
    eps:
      kind: scalar_or_shape_parameter
      default: null
      constraints:
      - op: value_in
        value: eps
        values:
        - null
        - 0
        - 1.0e-05
        - 0.001
  relations:
  - op: optional_shape_equals
    tensor: weight
    shape: normalized_shape
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_rms_norm.py
    name: test_rms_norm
    line: 15
  reviewed: true
