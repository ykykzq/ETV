      default: null
      constraints:
      - op: value_in
        value: stride
        values:
        - 1
        - 2
    padding:
      kind: scalar_or_shape_parameter
      default: 0
      constraints:
      - op: value_in
        value: padding
        values:
        - 0
        - 1
        - 2
    dilation:
      kind: scalar_or_shape_parameter
      default: 1
      constraints:
      - op: equals
        left: dilation
        right: 1
    ceil_mode:
      kind: scalar_or_shape_parameter
      default: false
      constraints:
      - op: value_in
        value: ceil_mode
        values:
        - false
        - true
  relations:
  - op: value_pair_in
