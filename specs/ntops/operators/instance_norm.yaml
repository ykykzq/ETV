schema: operator-requires/v1
operator:
  id: ntops.torch.instance_norm
  name: instance_norm
  revision: 1
  category: linear_algebra_and_normalization
requires:
  observed_domain_zh: 测试生成的浮点 shape 被前置 1 扩到至少 rank 3；weight/bias 独立可为 None 或 `(C,)`。`eps in {1e-8,1e-5,1e-3}`，`use_input_stats`
    与 `track_running_stats` 各为 bool。需要 running stats 时，两者为 `(C,)`，variance 由 `abs(randn)` 得到。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
      - op: rank_between
        tensor: input
        lower: 3
        upper: 4
      - op: channel_axis
        tensor: input
        axis: 1
    running_mean:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: running_mean
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: running_mean
        values:
        - float16
        - float32
      - op: device_is
        tensor: running_mean
        value: cuda
      - op: all_dims_between
        tensor: running_mean
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: running_mean
        generator: torch.randn
      - op: optional_shape_equals
        tensor: running_mean
        shape:
        - C
    running_var:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: running_var
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: running_var
        values:
        - float16
        - float32
      - op: device_is
        tensor: running_var
        value: cuda
      - op: all_dims_between
        tensor: running_var
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: running_var
        generator: torch.randn
      - op: optional_shape_equals
        tensor: running_var
        shape:
        - C
    weight:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: weight
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: weight
        values:
        - float16
        - float32
      - op: device_is
        tensor: weight
        value: cuda
      - op: all_dims_between
        tensor: weight
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: weight
        generator: torch.randn
      - op: optional_shape_equals
        tensor: weight
        shape:
        - C
    bias:
      kind: tensor
      optional: true
      default: null
      constraints:
      - op: rank_between
        tensor: bias
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: bias
        values:
        - float16
        - float32
      - op: device_is
        tensor: bias
        value: cuda
      - op: all_dims_between
        tensor: bias
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: bias
        generator: torch.randn
      - op: optional_shape_equals
        tensor: bias
        shape:
        - C
    use_input_stats:
      kind: scalar_or_shape_parameter
      default: true
      constraints:
      - op: value_in
        value: use_input_stats
        values:
        - false
        - true
    momentum:
      kind: scalar_or_shape_parameter
      default: 0.1
      constraints:
      - op: equals
        left: momentum
        right: 0.1
    eps:
      kind: scalar_or_shape_parameter
      default: 1.0e-05
      constraints:
      - op: value_in
        value: eps
        values:
        - 1.0e-08
        - 1.0e-05
        - 0.001
  relations: []
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_instance_norm.py
    name: test_instance_norm
    line: 16
  reviewed: true
