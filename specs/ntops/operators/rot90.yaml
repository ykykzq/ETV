schema: operator-requires/v1
operator:
  id: ntops.torch.rot90
  name: rot90
  revision: 1
  category: reduction_sort_and_shape
requires:
  observed_domain_zh: 测试生成的浮点 shape；rank 1 时追加一个长度 2 的轴，使 rank 至少 2。dims 是两个不同的合法非负轴；`k = r + 4q`，`r in
    {0,1,2,3}`、`q in [-100,100]`。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
      - op: rank_between
        tensor: input
        lower: 2
        upper: 4
    k:
      kind: scalar_or_shape_parameter
      default: 1
      constraints:
      - op: generated_by
        value: k
        generator: base in {0,1,2,3} + 4 * random.randint(-100, 100)
    dims:
      kind: scalar_or_shape_parameter
      default:
      - 0
      - 1
      constraints: []
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations:
  - op: two_distinct_valid_axes
    tensor: input
    axes: dims
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_rot90.py
    name: test_rot90
    line: 14
  reviewed: true
