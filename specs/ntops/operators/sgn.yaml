schema: operator-requires/v1
operator:
  id: ntops.torch.sgn
  name: sgn
  revision: 1
  category: elementwise
requires:
  observed_domain_zh: 测试生成的浮点输入中的实数输入；当基础 dtype 为 float32 且 `is_complex=True` 时，还构造同 shape 的 complex64
    输入。float16 的 `is_complex=True` 分支仍使用实数。
  arguments:
    input:
      kind: tensor
      constraints:
      - op: rank_between
        tensor: input
        lower: 1
        upper: 4
      - op: dtype_in
        tensor: input
        values:
        - float16
        - float32
      - op: device_is
        tensor: input
        value: cuda
      - op: all_dims_between
        tensor: input
        lower: 1
        upper: 1024
      - op: generated_by
        tensor: input
        generator: torch.randn
    out:
      kind: optional_output_buffer
      default: null
      constraints:
      - op: equals
        left: out
        right: null
  relations: []
evidence:
  status: inferred_from_tests
  source:
    repository: https://github.com/InfiniTensor/ntops.git
    commit: 9ae4166ad342e4745f0eed13a5a20d069e994fc0
    license: Apache-2.0
  tests:
  - path: tests/test_sgn.py
    name: test_sgn
    line: 12
  reviewed: true
